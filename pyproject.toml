[project]
name = "mojo-websockets"
version = "0.1.0"
description = "WebSocket framing and masking kernels implemented in Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "websocket", "rfc6455", "networking"]

[project.optional-dependencies]
dev = ["pytest", "websockets"]

[project.urls]
Homepage = "https://github.com/lee101/mojo-websockets"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
